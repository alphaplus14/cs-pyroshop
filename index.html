<!DOCTYPE html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C&amp;S Pyroshop | Pólvora y pirotecnia a domicilio</title>
    <meta name="theme-color" content="#0b0b12" />

    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap"
    />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/products.css" />

    <script src="js/config.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/catalog.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#catalogo">Saltar al catálogo</a>

    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="#" aria-label="C&amp;S Pyroshop, inicio">
          <img src="assets/img/logo-header.webp" alt="" width="180" height="128" />
          <span class="brand-name">C&amp;S <span>Pyroshop</span></span>
        </a>
        <nav class="main-nav" aria-label="Principal">
          <a href="#catalogo">Productos</a>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="section" id="catalogo" aria-labelledby="catalogo-title">
        <div class="container">
          <div class="section-head">
            <span class="eyebrow">Catálogo</span>
            <h2 class="section-title" id="catalogo-title">Nuestros productos</h2>
          </div>
          <div class="product-grid" id="product-grid"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-grid">
          <div class="footer-brand">
            <img src="assets/img/logo.webp" alt="C&amp;S Pyroshop" width="629" height="448" loading="lazy" />
            <p>Pólvora y pirotecnia para iluminar tus mejores momentos.</p>
          </div>
          <div>
            <h3>Contacto</h3>
            <ul>
              <li>
                <a href="https://wa.me/573165728348" target="_blank" rel="noopener">WhatsApp +57 316 572 8348</a>
              </li>
            </ul>
          </div>
        </div>
        <div class="legal">
          <p>© <span id="year">2026</span> C&amp;S Pyroshop.</p>
        </div>
      </div>
    </footer>

    <!-- Modal de video -->
    <div class="modal" id="video-modal" role="dialog" aria-modal="true" aria-labelledby="video-title" hidden>
      <div class="modal-dialog">
        <div class="modal-header">
          <h2 id="video-title">Video</h2>
          <button type="button" class="icon-btn modal-close" aria-label="Cerrar video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="video-frame"></div>
        <div class="modal-footer"></div>
      </div>
    </div>
  </body>
</html>
